# App lives at repo root (Next.js).
# Clear any old Netlify "Publish directory" / base override set to `samayoga`.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Required for /api/contact and /api/register (Resend). Set in Netlify → Site configuration → Environment variables:
  # RESEND_API_KEY=re_...   (from https://resend.com/api-keys — without this, forms return 503)
  # Optional: CONTACT_NOTIFY_EMAIL, RESEND_FROM_EMAIL (after domain verify in Resend)

[[plugins]]
  package = "@netlify/plugin-nextjs"
